name: ETL Sync & CI Quality Gate

on:
  push:
    branches: [main]
  schedule:
    # Runs every 6 hours automatically to sync Google Sheets updates
    - cron: "0 */6 * * *"
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  test-and-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install requests openpyxl pytest ruff

      - name: Lint and run Pytest on ETL sanitizers
        run: |
          ruff check scripts/
          PYTHONPATH=. pytest tests/

      - name: Run ETL Parser
        run: python scripts/etl_parser.py

      - name: Set up Node.js & Type-Check Frontend
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify TypeScript Contract
        working-directory: ./frontend
        run: |
          npm ci
          npx tsc --noEmit

      - name: Commit & Push updated JSON if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/src/data/projects.json
          git diff --staged --quiet || (git commit -m "chore(data): auto-sync projects.json from Google Sheets" && git push)