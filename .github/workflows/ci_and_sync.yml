name: Test and sync data

# when this runs:
#   - every time code is pushed to main
#   - every 6 hours, to pick up changes people made in the Google Sheet
#   - by hand, from the "Run workflow" button in the Actions tab
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  test-and-sync:
    runs-on: ubuntu-latest
    # the job needs write access because the last step pushes a commit
    permissions:
      contents: write

    steps:
      - name: Download the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: pip install -r requirements.txt

      # if a test fails the job stops here, so broken code never updates the website data
      - name: Check code style and run the tests
        run: |
          ruff check scripts/
          PYTHONPATH=. pytest tests/

      - name: Run the parser (downloads the sheet and rewrites projects.json)
        run: python scripts/etl_parser.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # makes sure the new projects.json still fits the Project type in the frontend
      - name: Type-check the frontend
        working-directory: ./frontend
        run: |
          npm ci
          npx tsc -b

      # "git diff --staged --quiet" succeeds when nothing changed, so we only
      # commit and push when the sheet really has new data
      - name: Commit projects.json if the data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/src/data/projects.json
          git diff --staged --quiet || (git commit -m "chore(data): auto-sync projects.json from Google Sheets" && git push)
